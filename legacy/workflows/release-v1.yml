name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build executable JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Assemble Windows release bundle
        shell: bash
        run: |
          bundle="release/ExaSecure-1.0.0"
          mkdir -p "$bundle/setup/sql"
          cp target/exasecure-1.0.0.jar "$bundle/ExaSecure.jar"
          cp README.md LICENSE database.sql db.properties.example setup.ps1 pom.xml "$bundle/"
          cp build_jar.bat build_jar.sh run_onwindows.bat run_onmacos.sh "$bundle/"
          cp .gitignore "$bundle/"
          cp -R src "$bundle/"
          cp setup/sql/schema-v3.sql "$bundle/setup/sql/"
          (cd release && zip -r ExaSecure-1.0.0-windows.zip ExaSecure-1.0.0)
          sha256sum target/exasecure-1.0.0.jar release/ExaSecure-1.0.0-windows.zip > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/exasecure-1.0.0.jar \
            release/ExaSecure-1.0.0-windows.zip \
            release/SHA256SUMS.txt \
            --title "ExaSecure 1.0.0" \
            --generate-notes \
            --verify-tag
